
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agronom — Kirish</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f7f2;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #168447;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #168447;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #168447;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        a {
            color: #168447;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>AI Agronom 🌱</h1>
    <p class="subtitle">Akkauntingizga kiring</p>

    <form id="loginForm">
        <label for="contact">Telefon raqami yoki email</label>
        <input
            type="text"
            id="contact"
            placeholder="+998901234567 yoki email"
            required
        >

        <label for="password">Parol</label>
        <input
            type="password"
            id="password"
            placeholder="Parolingizni kiriting"
            required
        >

        <button type="submit" id="loginButton">
            Kirish →
        </button>
    </form>

    <div id="message"></div>

    <div class="register-link">
        Akkauntingiz yo‘qmi?
        <a href="register.html">Ro‘yxatdan o‘tish</a>
    </div>
</div>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const contact = document.getElementById("contact").value.trim();
        const password = document.getElementById("password").value;

        const isEmail = contact.includes("@");

        const requestData = {
            email: isEmail ? contact : null,
            phone_number: isEmail ? null : contact,
            password: password
        };

        button.disabled = true;
        button.textContent = "Tekshirilmoqda...";
        message.textContent = "";

        try {
            const response = await fetch(
                "http://127.0.0.1:8000/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestData)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || "Kirish amalga oshmadi"
                );
            }

            localStorage.setItem(
                "ai_agronom_user",
                JSON.stringify(result.user)
            );

            message.style.color = "green";
            message.textContent = "Muvaffaqiyatli kirdingiz!";

            window.location.href = "index.html";

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Kirish →";
        }
    });
</script>

</body>
</html>
